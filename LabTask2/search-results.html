<!DOCTYPE	html>
<html	lang="en">
<head>
<meta	charset="UTF-8">
<meta	name="viewport"	content="width=device-width, initial-scale=1.0">
<title>Phone Search Results | FuturePhone</title>
</head>

<body>

<header>
    <h1>FuturePhone</h1>

    <!-- Search Form -->
    <form action="#" method="get">
        <label for="search"> Search phones:  </label>
            <input
                type="search"
                id="search"
                name="search"
                placeholder="Search for a phone">

            <button type="submit"> Search </button>

    </form>

        <br>

        <!-- Website Navigation -->
        <nav>

            <a href="home.html">Home</a>
            |
            <a href="search-results.html">Phones</a>
            |

            <a href="#">Account</a>
            |
            <a href="product-details.html">Product Details</a>
            |
            <a href="#">Cart</a>

        </nav>

    </header>

        <!-- Breadcrumb -->
    <nav aria-label="Breadcrumb">  <!-- it shows us where we are in the website  like :  Home > Mobile Phones > Smartphones-->

        <a href="home.html">Home</a> &gt;

        <a href="search-results.html">Mobile Phones</a> &gt;

        <span>Smartphones</span> <!-- this we use it for current page becuase we dont need to be link -->

    </nav>
<main>

        <!-- Filter Area -->
        <aside>       <!-- extra content related to the main content -->        
            <h2>Refine Results</h2>
            <form action="#" method="get">
                <!-- Brand Checkboxes -->
                <fieldset>
                    <legend>Phone Brand</legend>
                    <label>
                        <input
                            type="checkbox"
                            name="brand"
                            value="NovaTech">
                            NovaTech
                    </label>

                    <br>   <!-- new line -->

                    <label>
                        <input
                            type="checkbox"
                            name="brand"
                            value="OrbitMobile">
                            OrbitMobile
                    </label>

                    <br>

                    <label>
                        <input
                            type="checkbox"
                            name="brand"
                            value="PixelCore">
                            PixelCore
                    </label>

                    <br>

                    <label>
                        <input
                            type="checkbox"
                            name="brand"
                            value="ZenPhone">
                            ZenPhone
                    </label>

                </fieldset>

                <br>

<!-- Rating Radio Buttons -->
<fieldset>
    <legend>Customer Rating</legend>
        <label>
            <input
                type="radio"        
                name="rating"
                value="4">
                4 stars and above
        </label>

    <br>

        <label>
                <input
                    type="radio"
                    name="rating"
                    value="3">
                    3 stars and above
        </label>

    <br>
        <label>
                <input
                    type="radio"
                    name="rating"
                    value="all"
                    checked>
                    All ratings
        </label>

</fieldset>

    <br>

    <!-- Price Range -->
<fieldset>
    <legend>Price Range</legend>
        <label for="minimum-price"> Minimum Price: </label>
            <input
                type="number"
                id="minimum-price"
                name="minimum-price"
                min="0">

        <br>
        <br>

        <label for="maximum-price"> Maximum Price: </label>
            <input
                type="number"
                id="maximum-price"
                name="maximum-price"
                min="0">

</fieldset>

        <br>
        <button type="submit"> Apply Filters </button>
        <button type="reset"> Clear Filters </button>

        </form>

</aside>

    <hr>  <!-- separator line -->


</main>


</body>

</html>
